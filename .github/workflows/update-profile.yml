name: Refresh Now and Work

on:
  schedule:
    - cron: "23 */3 * * *"   # every 3 hours
  push:
    branches: [main]
    paths: [data/projects.json, scripts/update_profile.py]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-update
  cancel-in-progress: false

jobs:
  profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install font tools
        run: pip install fonttools brotli

      - name: Update Now line and Work cards
        run: python scripts/update_profile.py
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || github.token }}

      - name: Commit if changed
        run: |
          git add -A
          if git diff --cached --quiet; then echo "Nothing new"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh Now and Work"
          git pull --rebase origin main
          git push
