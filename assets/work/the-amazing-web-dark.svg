<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="64" viewBox="0 0 1280 64" role="img" aria-label="The Amazing Web: Interactive 3D map of the Spider-Verse. Opens the repository.">
<style>
@font-face{font-family:N5;src:url(data:font/woff2;base64,) format('woff2');font-weight:500}
@font-face{font-family:N5;src:url(data:font/woff2;base64,) format('woff2');font-weight:500;unicode-range:U+1E5A}
@font-face{font-family:D4;src:url(data:font/woff2;base64,) format('woff2')}
@font-face{font-family:JB;src:url(data:font/woff2;base64,) format('woff2')}
.name{font-family:N5,Inter,sans-serif;font-weight:500;font-size:26px}
.desc{font-family:D4,Inter,sans-serif;font-size:21px}
.hub{font-family:JB,ui-monospace,SFMono-Regular,Menlo,monospace;font-size:16px;letter-spacing:.08em}
path{fill:none;stroke-width:1}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes ring{0%{transform:scale(1);opacity:.7}100%{transform:scale(3.2);opacity:0}}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .6s ease-out both}
.rise{animation:rise .6s cubic-bezier(.2,.7,.2,1) both}
.ring{transform-box:fill-box;transform-origin:center;animation:ring 2.2s ease-out 1.8s infinite both}
@media (prefers-reduced-motion:reduce){.draw,.rise,.ring{animation:none}.draw{stroke-dashoffset:0}.ring{opacity:0}}
</style>
<rect width="1280" height="64" fill="#0D1117"/>
<path class="draw" pathLength="1" style="animation-delay:0.87s" d="M80 4V60" stroke="#30363D"/><path class="draw" pathLength="1" style="animation-delay:0.87s" d="M290 32H420" stroke="#30363D"/><g class="rise" style="animation-delay:0.87s"><circle cx="80" cy="32" r="5" fill="#0D1117" stroke="#57606A" stroke-width="2"/><text class="hub" x="104" y="38" style="fill:#8B949E">WEB &amp; 3D</text></g><g class="rise" style="animation-delay:1.02s"><circle cx="420" cy="32" r="3" fill="#57606A"/><text class="name" x="440" y="41" style="fill:#E6EDF3">The Amazing Web</text><text class="desc" x="700" y="39" style="fill:#8B949E">Interactive 3D map of the Spider-Verse</text></g>
</svg>
