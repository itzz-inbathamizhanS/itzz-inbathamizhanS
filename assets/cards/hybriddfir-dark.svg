<svg xmlns="http://www.w3.org/2000/svg" width="640" height="250" viewBox="0 0 640 250" role="img" aria-label="Hybrid DFIR: Air-gapped memory and disk forensics"><style>@font-face{font-family:N;src:url(data:font/woff2;base64,) format('woff2');font-weight:600}
@font-face{font-family:G;src:url(data:font/woff2;base64,) format('woff2');font-weight:500}
@font-face{font-family:L;src:url(data:font/woff2;base64,) format('woff2');font-weight:400}
.phone{display:none}
@media (max-width:300px){.desk{display:none}.phone{display:inline}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pulse{0%{transform:scale(1);opacity:.5}70%,100%{transform:scale(3);opacity:0}}
.rule{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1s cubic-bezier(.16,1,.3,1) both}
.rise{animation:rise .8s cubic-bezier(.16,1,.3,1) both}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.6s cubic-bezier(.16,1,.3,1) 2s infinite both}
@media (prefers-reduced-motion:reduce){.rule,.rise,.pulse{animation:none}.rule{stroke-dashoffset:0}.pulse{opacity:0}}</style><line class="rule" style="animation-delay:0.56s" x1="0" y1="1" x2="596" y2="1" pathLength="1" stroke="#E6EDF3" stroke-opacity=".28" stroke-width="2"/><g class="rise" style="animation-delay:0.71s"><g class="desk"><text x="2" y="96" font-family="N" font-weight="600" font-size="56" letter-spacing="-.01em" fill="#E6EDF3">Hybrid DFIR</text><text x="2" y="150" font-family="L" font-weight="400" font-size="31" fill="#8B949E"><tspan x="2" dy="0.0">Air-gapped memory and disk forensics</tspan></text></g><g class="phone"><text x="2" y="104" font-family="N" font-weight="600" font-size="80" letter-spacing="-.01em" fill="#E6EDF3">Hybrid DFIR</text><text x="2" y="172" font-family="L" font-weight="400" font-size="46" fill="#8B949E"><tspan x="2" dy="0.0">Air-gapped memory and disk</tspan><tspan x="2" dy="54.3">forensics</tspan></text></g></g></svg>
