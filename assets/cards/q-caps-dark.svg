<svg xmlns="http://www.w3.org/2000/svg" width="640" height="194" viewBox="0 0 640 194" role="img" aria-label="Q-CAPS: Learn, test and scan post-quantum crypto"><style>@font-face{font-family:N;src:url(data:font/woff2;base64,) format('woff2');font-weight:600}@font-face{font-family:G;src:url(data:font/woff2;base64,) format('woff2');font-weight:500}@font-face{font-family:L;src:url(data:font/woff2;base64,) format('woff2');font-weight:400}.phone{display:none}@media (max-width:300px){.desk{display:none}.phone{display:inline}}@keyframes draw{to{stroke-dashoffset:0}}@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}@keyframes pulse{0%{transform:scale(1);opacity:.5}70%,100%{transform:scale(3);opacity:0}}.rule{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1s cubic-bezier(.16,1,.3,1) both}.rise{animation:rise .8s cubic-bezier(.16,1,.3,1) both}.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.6s cubic-bezier(.16,1,.3,1) 2s infinite both}@media (prefers-reduced-motion:reduce){.rule,.rise,.pulse{animation:none}.rule{stroke-dashoffset:0}.pulse{opacity:0}}</style><line class="rule" style="animation-delay:0.47s" x1="44" y1="1" x2="640" y2="1" pathLength="1" stroke="#E6EDF3" stroke-opacity=".22" stroke-width="2"/><g class="rise" style="animation-delay:0.62s"><g class="desk"><text x="46" y="72" font-family="N" font-weight="600" font-size="42" letter-spacing="-.01em" fill="#E6EDF3">Q-CAPS</text><text x="46" y="114" font-family="L" font-weight="400" font-size="26" fill="#8B949E"><tspan x="46" dy="0.0">Learn, test and scan post-quantum crypto</tspan></text></g><g class="phone"><text x="46" y="66" font-family="N" font-weight="600" font-size="50" letter-spacing="-.01em" fill="#E6EDF3">Q-CAPS</text><text x="46" y="120" font-family="L" font-weight="400" font-size="44" fill="#8B949E"><tspan x="46" dy="0.0">Learn, test and scan</tspan><tspan x="46" dy="50.6">post-quantum crypto</tspan></text></g></g></svg>
