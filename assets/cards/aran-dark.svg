<svg xmlns="http://www.w3.org/2000/svg" width="640" height="176" viewBox="0 0 640 176" role="img" aria-label="Aran: Data-flow firewall for Indian banks (current)"><style>@font-face{font-family:N;src:url(data:font/woff2;base64,) format('woff2');font-weight:600}
@font-face{font-family:G;src:url(data:font/woff2;base64,) format('woff2');font-weight:500}
@font-face{font-family:L;src:url(data:font/woff2;base64,) format('woff2');font-weight:400}
.phone{display:none}
@media (max-width:300px){.desk{display:none}.phone{display:inline}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pulse{0%{transform:scale(1);opacity:.5}70%,100%{transform:scale(3);opacity:0}}
.rule{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1s cubic-bezier(.16,1,.3,1) both}
.rise{animation:rise .8s cubic-bezier(.16,1,.3,1) both}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.6s cubic-bezier(.16,1,.3,1) 2s infinite both}
